<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nuôi Gà</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="game">


<h1>🐔 Nuôi Gà</h1>


<div id="chicken">
🥚
</div>



<div class="stats">


<p>⭐ Level:
<span id="level">0</span>
</p>


<p>🐣 Trạng thái:
<span id="stage">Trứng</span>
</p>


<p>🔥 EXP:
<span id="exp">0/100</span>
</p>


<p>🪙 Xu:
<span id="coin">0</span>
</p>


<p>🥚 Trứng thường:
<span id="egg">0</span>
</p>


<p>🎂 Tuổi:
<span id="age">0</span>/<span id="maxAge">7</span> ngày
</p>



<p id="timeBox">
⏳ <span id="time">Còn 10s</span>
</p>



</div>



<h3>🍚 Cho ăn</h3>


<button onclick="camThuong()">
🌽 Cám thường +10 EXP
</button>


<button onclick="camTangTrong()">
🐷 Cám tăng trọng +30 EXP
</button>


<button onclick="camConHeo()">
🐖 Cám con heo +50 EXP
</button>


<button onclick="camTangTruong()">
⚡ Cám tăng trưởng +100 EXP
</button>


<button onclick="camSieuVip()">
✨ Cám siêu VIP +300 EXP
</button>



<br><br>


<button onclick="sellEgg()">
🥚 Bán trứng +25 xu
</button>


<button id="sellButton" onclick="sellChicken()" style="display:none;">
🐔 Bán gà +600 xu
</button>



</div>


<script src="game.js"></script>


</body>

</html>
