<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nuôi Gà</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="game">


<!-- ================= NHÀ ================= -->

<div id="homePage" class="page active">


<h1>🐔 Nuôi Gà</h1>


<div id="chicken">
🥚
</div>


<h2 id="stage">
Trứng
</h2>



<div class="stats">


<div class="status">
⭐ Lv <span id="level">0</span>
</div>


<div class="status">
🔥 <span id="exp">0/100</span>
</div>


<div class="status">
🪙 <span id="coin">0</span>
</div>


<div class="status">
🥚 <span id="egg">0</span>
</div>


<div class="status">
🎂 <span id="age">0</span>/7
</div>


</div>



<div id="timeBox">

⏳ <span id="time">
Còn 10s
</span>

</div>



<h3>🍚 Cho ăn</h3>


<div class="buttons">


<button onclick="camThuong()">
🌽 +10
</button>


<button onclick="camTangTrong()">
🐷 +30
</button>


<button onclick="camConHeo()">
🐖 +50
</button>


<button onclick="camTangTruong()">
⚡ +100
</button>


<button onclick="camSieuVip()">
✨ +300
</button>


</div>




<div class="actions">


<button onclick="sellEgg()">
🥚 Bán trứng
</button>



<button id="sellButton" onclick="sellChicken()" style="display:none">

🐔 Bán gà

</button>


</div>


</div>







<!-- ================= CHUỒNG ================= -->


<div id="coopPage" class="page">


<h2>🏠 Chuồng gà</h2>


<div class="box">


<p>🐔 Gà hiện tại</p>


<p id="coopInfo">

Đang tải...

</p>



</div>


</div>









<!-- ================= KHO ================= -->


<div id="eggPage" class="page">


<h2>🥚 Kho</h2>



<div class="box">


<p>
🥚 Trứng thường:
<span id="storageEgg">0</span>
</p>



<p>
🟡 Trứng vàng:
0
</p>



<p>
💎 Trứng kim cương:
0
</p>


</div>



</div>









<!-- ================= SHOP ================= -->


<div id="shopPage" class="page">


<h2>🏪 Shop</h2>



<div class="box">


<button onclick="buyEgg()">

🥚 Trứng thường

<br>

250 xu

</button>



<br>



<button>

🥚 Trứng siêu cấp

<br>

3000 xu

</button>



<br>



<button>

🍚 Cám

</button>


</div>


</div>









<!-- ================= NHIỆM VỤ ================= -->


<div id="questPage" class="page">


<h2>🎯 Nhiệm vụ</h2>



<div class="box">


<p>
🎁 Nhận thưởng random
</p>


<p>
500 - 5000 xu
</p>



<button onclick="questReward()">

Nhận thưởng

</button>


</div>


</div>









<!-- ================= TÀI KHOẢN ================= -->


<div id="accountPage" class="page">


<h2>👤 Tài khoản</h2>



<div class="box">


<p>
🆔 ID:
<span id="userID">
10001
</span>

</p>



<p>
👤 Tên:
<span id="username">
ChickenPlayer
</span>

</p>



<p>
🪙 Ví xu:
<span id="wallet">
0
</span>

</p>



<button onclick="withdrawDemo()">

💸 Rút tiền DEMO

</button>


</div>


</div>









<!-- ================= MENU ================= -->


<div class="menu">


<button onclick="openPage('homePage')">

🏠
<br>
Nhà

</button>



<button onclick="openPage('coopPage')">

🐔
<br>
Chuồng

</button>



<button onclick="openPage('eggPage')">

🥚
<br>
Kho

</button>



<button onclick="openPage('shopPage')">

🏪
<br>
Shop

</button>



<button onclick="openPage('questPage')">

🎯
<br>
Nhiệm vụ

</button>



<button onclick="openPage('accountPage')">

👤
<br>
TK

</button>



</div>




</div>



<script src="game.js"></script>


</body>

</html>
