<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nuôi Gà</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>


<div class="game">


    <h1>🐔 Nuôi Gà</h1>


    <div id="chicken">

        <img src="images/065ADA2B-9A98-47DA-976C-DB49D1274329.png">

    </div>



    <div class="stats">


        <p>🐔 Tên: Gà con</p>

        <p>⭐ Level:
            <span id="level">1</span>
        </p>


        <p>🔥 EXP:
            <span id="exp">0</span>/100
        </p>


        <p>🍚 Độ no:
            <span id="food">100</span>%
        </p>


        <p>🪙 Xu:
            <span id="coin">0</span>
        </p>


    </div>



    <button onclick="feed()">

        🍎 Cho ăn

    </button>



</div>



<script src="game.js"></script>


</body>

</html>
