<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nuôi Gà</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="game">


<h1>🐔 Nuôi Gà</h1>


<div id="chicken">
🥚
</div>


<h2 id="stage">
Trứng
</h2>



<div class="stats">


<div class="status">
⭐ Lv
<span id="level">0</span>
</div>


<div class="status">
🔥
<span id="exp">0/100</span>
</div>


<div class="status">
🪙
<span id="coin">0</span>
</div>


<div class="status">
🥚
<span id="egg">0</span>
</div>


<div class="status">
🎂
<span id="age">0</span>/<span id="maxAge">7</span>
</div>


</div>




<div id="timeBox">

⏳ <span id="time">Còn 10s</span>

</div>





<div class="feed-box">


<h3>🍚 Cho ăn</h3>



<div class="buttons">


<button onclick="camThuong()">
🌽 +10
</button>


<button onclick="camTangTrong()">
🐷 +30
</button>


<button onclick="camConHeo()">
🐖 +50
</button>


<button onclick="camTangTruong()">
⚡ +100
</button>


<button onclick="camSieuVip()">
✨ +300
</button>


</div>


</div>





<div class="actions">


<button onclick="sellEgg()">
🥚 Bán trứng
</button>



<button id="sellButton" onclick="sellChicken()" style="display:none;">
🐔 Bán gà
</button>


</div>



</div>



<script src="game.js"></script>


</body>

</html>
