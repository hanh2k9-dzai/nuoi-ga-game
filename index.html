<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nuôi Gà</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="game">



<!-- ================= NHÀ ================= -->

<div id="homePage" class="page active">


<h1>🐔 Nuôi Gà</h1>


<div id="mainChicken">
🐔
</div>


<h2 id="mainStatus">
Đang tải...
</h2>




<div class="stats">


<div class="status">
🪙 <span id="coin">0</span>
</div>


<div class="status">
🥚 <span id="egg">0</span>
</div>


<div class="status">
⭐ <span id="level">0</span>
</div>


<div class="status">
🔥 <span id="exp">0</span>
</div>


</div>




<div class="buttons">


<button onclick="feedSelected(10)">
🌽 Cám thường
</button>


<button onclick="feedSelected(50)">
⚡ Cám tăng
</button>



</div>



</div>









<!-- ================= CHUỒNG ================= -->


<div id="coopPage" class="page">


<h2 id="coopName">
🏠 Chuồng thường
</h2>


<p>
Sức chứa:
<span id="coopCapacity">
3
</span>
</p>



<div id="chickenSlots" class="slots">


</div>



<h3>Đổi chuồng</h3>



<button onclick="buySuperCoop()">

🔥 Chuồng siêu cấp

<br>

25.000 xu

</button>



<button onclick="buyStarCoop()">

⭐ Chuồng siêu sao

<br>

20.000đ

</button>



</div>









<!-- ================= KHO ================= -->


<div id="storagePage" class="page">


<h2>🥚 Kho</h2>



<div class="box">


<p>
🥚 Trứng thường:

<span id="normalEgg">
0
</span>

</p>


<p>
✨ Trứng siêu cấp:

<span id="superEgg">
0
</span>

</p>



<p>
🟡 Trứng vàng:

<span id="goldEgg">
0
</span>

</p>



<p>
💎 Trứng kim cương:

<span id="diamondEgg">
0
</span>

</p>


</div>



</div>









<!-- ================= SHOP ================= -->


<div id="shopPage" class="page">


<h2>🏪 Shop gà</h2>




<button onclick="buyNormalChicken()">

🐔 Gà thường

<br>

400 xu

</button>



<br>



<button onclick="buySuperChicken()">

🔥 Gà siêu cấp

<br>

2000 xu

</button>



<br>



<button>

🟡 Gà vàng

<br>

35000đ

</button>



<br>



<button>

💎 Gà kim cương

<br>

80000đ

</button>



</div>









<!-- ================= NHIỆM VỤ ================= -->


<div id="questPage" class="page">


<h2>🎯 Nhiệm vụ</h2>


<div class="box">


<p>
Nhận thưởng random
</p>


<p>
500 - 5000 xu
</p>


<button onclick="questReward()">

🎁 Nhận

</button>


</div>


</div>









<!-- ================= TÀI KHOẢN ================= -->


<div id="accountPage" class="page">


<h2>👤 Tài khoản</h2>



<div class="box">


<p>
🆔 ID:

<span id="userID">
10001
</span>

</p>



<p>
👤 Tên:

<span id="username">
ChickenPlayer
</span>

</p>



<p>
🪙 Ví xu:

<span id="wallet">
0
</span>

</p>



<button onclick="withdrawDemo()">

💸 Rút tiền demo

</button>


</div>


</div>









<!-- ================= MENU ================= -->


<div class="menu">


<button onclick="openPage('homePage')">

🏠
<br>
Nhà

</button>



<button onclick="openPage('coopPage')">

🐔
<br>
Chuồng

</button>



<button onclick="openPage('storagePage')">

🥚
<br>
Kho

</button>



<button onclick="openPage('shopPage')">

🏪
<br>
Shop

</button>



<button onclick="openPage('questPage')">

🎯
<br>
Nhiệm vụ

</button>



<button onclick="openPage('accountPage')">

👤
<br>
TK

</button>


</div>




</div>



<script src="game.js"></script>


</body>

</html>
